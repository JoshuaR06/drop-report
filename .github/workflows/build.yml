name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # attach the exe to tagged releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test tests/BootyBoard.Tests -c Release
      - name: Publish single-file exe
        run: dotnet publish src/BootyBoard.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: BootyBoard
          path: publish/BootyBoard.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/BootyBoard.exe
            THIRD-PARTY-NOTICES.md
          generate_release_notes: true
